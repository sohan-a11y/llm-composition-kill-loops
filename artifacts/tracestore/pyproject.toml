[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tracestore"
version = "0.1.0"
description = "Execution traces as context for AI coding assistants. MCP server + pytest plugin."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
tracestore = "tracestore.cli:main"

[project.entry-points.pytest11]
tracestore = "tracestore.pytest_plugin"

[tool.setuptools.packages.find]
include = ["tracestore*"]
